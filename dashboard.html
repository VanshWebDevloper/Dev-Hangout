<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk2Code - Dashboard</title>
  <style>
    :root {
      --bg-base: #0d1117;
      --bg-surface: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --online-green: #3fb950;
      --danger-red: #f85149;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 20px; font-weight: 600; color: #ffffff; }
    
    .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .logout-btn:hover { color: var(--danger-red); border-color: var(--danger-red); }
    
    .main-layout { max-width: 720px; margin: 0 auto; width: 100%; padding: 24px 16px; flex: 1; }
    
    .welcome-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .welcome-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .welcome-card p { color: var(--text-muted); font-size: 14px; }
    
    .search-ctrl { width: 100%; padding: 12px 14px; background-color: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 20px; }
    .search-ctrl:focus { border-color: var(--primary); }
    
    .pool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .pool-title { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .pool-counter { font-size: 12px; background-color: var(--bg-surface); border: 1px solid var(--border); padding: 2px 8px; border-radius: 12px; }
    
    .nodes-container { display: flex; flex-direction: column; gap: 10px; }
    .user-node { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    
    .node-details h3 { font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 2px; }
    .node-status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-online { color: var(--online-green); }
    .status-online .indicator { background-color: var(--online-green); box-shadow: 0 0 6px var(--online-green); }
    .status-offline { color: var(--text-muted); }
    .status-offline .indicator { background-color: var(--text-muted); }
    
    .connect-link { text-decoration: none; background-color: var(--primary); color: #ffffff; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: opacity 0.2s; }
    .connect-link:hover { opacity: 0.9; }
    
    .status-info-box { text-align: center; padding: 32px; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>Talk2Code</h1>
    <button class="logout-btn" id="logout-trigger">Log Out</button>
  </header>

  <div class="main-layout">
    <div class="welcome-card">
      <h2>Welcome, <span id="client-user-display" style="color: var(--primary);">Developer</span></h2>
      <p>Select an active peer from the directory pool below to start cross-communication.</p>
    </div>

    <input type="text" id="directory-search" class="search-ctrl" placeholder="Filter developers by handle..." autocomplete="off" />

    <div class="pool-header">
      <div class="pool-title">Available Peers</div>
      <div class="pool-counter" id="active-nodes-count">0 Active</div>
    </div>

    <div class="nodes-container" id="directory-target">
      <div class="status-info-box">Scanning local synchronization streams...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOrdL6yJ7dVnMbl6YrWjLkf-yKIT0sxSc",
      authDomain: "talk2code-v2.firebaseapp.com",
      projectId: "talk2code-v2",
      storageBucket: "talk2code-v2.firebasestorage.app",
      messagingSenderId: "132782409852",
      appId: "1:132782409852:web:bbac1d304fa78c491761f9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const clientUserDisplay = document.getElementById("client-user-display");
    const directoryTarget = document.getElementById("directory-target");
    const directorySearch = document.getElementById("directory-search");
    const activeNodesCount = document.getElementById("active-nodes-count");

    let applicationUsersCache = [];

    function generateRoomLink(id1, id2) {
      return [id1, id2].sort().join("_");
    }

    function executeRender(filterKeyword = "") {
      directoryTarget.innerHTML = "";
      let visibleCount = 0;

      const filteredList = applicationUsersCache.filter(u => 
        u.payload.username && u.payload.username.toLowerCase().includes(filterKeyword.toLowerCase())
      );

      filteredList.forEach((userNode) => {
        visibleCount++;
        const uData = userNode.payload;
        const generatedRoom = generateRoomLink(auth.currentUser.uid, userNode.id);
        
        const nodeItem = document.createElement("div");
        nodeItem.className = "user-node";
        
        const currentStatusMarkup = uData.isOnline
          ? `<div class="node-status status-online"><span class="indicator"></span>Online</div>`
          : `<div class="node-status status-offline"><span class="indicator"></span>Offline</div>`;

        nodeItem.innerHTML = `
          <div class="node-details">
            <h3>${uData.username}</h3>
            ${currentStatusMarkup}
          </div>
          <a class="connect-link" href="chat.html?room=${generatedRoom}&peer=${userNode.id}&name=${encodeURIComponent(uData.username)}">Connect</a>
        `;
        directoryTarget.appendChild(nodeItem);
      });

      activeNodesCount.textContent = `${visibleCount} Peer Nodes`;
      if (visibleCount === 0) {
        directoryTarget.innerHTML = `<div class="status-info-box">No developers match your query parameters.</div>`;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      // Rigid Guard Check: Kick out unverified users instantly
      if (!user || !user.emailVerified) { 
        window.location.href = "index.html"; 
        return; 
      }

      const userProfileSnap = await getDoc(doc(db, "users", user.uid));
      if (userProfileSnap.exists()) {
        clientUserDisplay.textContent = userProfileSnap.data().username;
      }

      await updateDoc(doc(db, "users", user.uid), {
        isOnline: true,
        lastSeen: serverTimestamp()
      }).catch(() => {});

      onSnapshot(collection(db, "users"), (querySnapshot) => {
        applicationUsersCache = [];
        querySnapshot.forEach((docRef) => {
          // Display other verified profiles only
          if (docRef.id !== user.uid && docRef.data().email) {
            applicationUsersCache.push({ id: docRef.id, payload: docRef.data() });
          }
        });
        executeRender(directorySearch.value);
      });
    });

    directorySearch.addEventListener("input", (e) => executeRender(e.target.value));

    document.getElementById("logout-trigger").addEventListener("click", async () => {
      if (auth.currentUser) {
        await updateDoc(doc(db, "users", auth.currentUser.uid), {
          isOnline: false,
          lastSeen: serverTimestamp()
        }).catch(() => {});
      }
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
