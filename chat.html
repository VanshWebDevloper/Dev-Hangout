<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Talk2Code - Secure Comm</title>
  <style>
    /* -------------------------------------------
       STRICT APP-LIKE LAYOUT (No Body Scrolling)
    ------------------------------------------- */
    :root {
      --bg-main: #0d1117; --bg-surface: #161b22; --bg-input: #010409;
      --border: #30363d; --text: #c9d1d9; --text-muted: #8b949e;
      --bubble-mine: #1f6feb; --bubble-other: #21262d; --primary: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { height: 100vh; display: flex; flex-direction: column; background: var(--bg-main); color: var(--text); overflow: hidden; }

    /* -------------------------------------------
       TOP NAVIGATION BAR
    ------------------------------------------- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10;
    }
    .back { text-decoration: none; color: var(--text-muted); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .back:hover { color: var(--text); }
    .peer-info { flex: 1; text-align: center; }
    .peer-info h2 { font-size: 16px; color: var(--text); }
    .peer-info span { font-size: 11px; color: #3fb950; font-weight: 600; letter-spacing: 0.5px; }
    
    .vc-btn {
      background: var(--primary); border: none; color: white; font-weight: 700;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .vc-btn:hover { background: #2ea043; transform: scale(1.05); }

    /* -------------------------------------------
       NATIVE WEBRTC CALL CONTAINER
    ------------------------------------------- */
    #call-container {
      width: 100%; height: 60vh; display: none; background: #000;
      border-bottom: 2px solid var(--border); position: relative;
    }
    .status-bar { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--bg-input); text-align: center; border-bottom: 1px solid var(--border); }

    /* -------------------------------------------
       CHAT VIEWPORT (Auto-Scrollable)
    ------------------------------------------- */
    #chat-box {
      flex: 1; overflow-y: auto; padding: 20px 16px; display: flex;
      flex-direction: column; gap: 14px; scroll-behavior: smooth;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* Advanced Message Bubbles */
    .message {
      max-width: 80%; display: flex; flex-direction: column;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

    .message.other { align-self: flex-start; }
    .message.mine { align-self: flex-end; }

    .bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4;
      word-break: break-word; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .message.other .bubble { background: var(--bubble-other); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .message.mine .bubble { background: var(--bubble-mine); color: white; border-bottom-right-radius: 4px; }

    /* Timestamps */
    .time { font-size: 10px; color: var(--text-muted); margin-top: 4px; padding: 0 4px; }
    .message.mine .time { text-align: right; }

    /* -------------------------------------------
       INPUT COMMAND CENTER
    ------------------------------------------- */
    .input-area {
      display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-surface);
      border-top: 1px solid var(--border); align-items: flex-end;
    }
    
    #msg-input {
      flex: 1; min-height: 44px; max-height: 120px; border: 1px solid var(--border);
      border-radius: 20px; background: var(--bg-input); color: var(--text); padding: 10px 16px;
      font-size: 15px; outline: none; resize: none; overflow-y: auto; line-height: 1.4;
      transition: border 0.3s;
    }
    #msg-input:focus { border-color: #58a6ff; }
    
    #send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--bubble-mine); color: white; cursor: pointer;
      display: flex; justify-content: center; align-items: center; transition: 0.3s; flex-shrink: 0;
    }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn svg { width: 20px; height: 20px; fill: currentColor; transform: translateX(2px); }
  </style>
</head>
<body>

  <header>
    <a href="dashboard.html" class="back">❮ Hub</a>
    <div class="peer-info">
      <h2 id="room-title">Establishing...</h2>
      <span id="room-status">E2E Encrypted</span>
    </div>
    <button class="vc-btn" id="vc-trigger-btn" onclick="startMediaEngine()">Initialize Call</button>
  </header>

  <div id="call-container"></div>
  <div class="status-bar" id="status-text">Connection verified. Securing channel...</div>
  
  <div id="chat-box"></div>

  <div class="input-area">
    <textarea id="msg-input" placeholder="Transmit message..." rows="1"></textarea>
    <button id="send-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
    </button>
  </div>

  <script src="https://resource.zegocloud.com/prebuilt/crypto-js.js"></script>
  <script src="https://resource.zegocloud.com/prebuilt/zego-express-engine-webrtc-3.0.0.js"></script>
  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt@latest/zego-uikit-prebuilt.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // V2 CONFIGURATION APPLIED
    const firebaseConfig = {
      apiKey: "AIzaSyCOrdL6yJ7dVnMbl6YrWjLkf-yKIT0sxSc",
      authDomain: "talk2code-v2.firebaseapp.com",
      projectId: "talk2code-v2",
      storageBucket: "talk2code-v2.firebasestorage.app",
      messagingSenderId: "132782409852",
      appId: "1:132782409852:web:bbac1d304fa78c491761f9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Dynamic Variables & Elements
    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const statusText = document.getElementById("status-text");
    const vcTriggerBtn = document.getElementById("vc-trigger-btn");

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room");
    const peerId = params.get("peer");
    const peerName = params.get("name") || "Developer";

    let currentUser = null;
    let myName = "Dev";

    // Initialize UI Parameters
    document.getElementById("room-title").textContent = peerName;

    // Smart Auto-Resize for Textarea
    msgInput.addEventListener("input", function() {
      this.style.height = "44px"; 
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
      sendBtn.disabled = this.value.trim().length === 0;
    });

    // Time Formatting Engine (E.g., "04:58 PM")
    function formatTime(ms) {
      if(!ms) return "";
      const d = new Date(ms);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Scroll locking algorithm
    function scrollToBottom() { chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' }); }

    // Core Chat Initialization
    async function initChatEngine(user) {
      if(!roomId) { chatBox.innerHTML = "<div style='text-align:center;color:red'>Critical Error: Room ID missing.</div>"; return; }

      // Validate & Register Room Space
      const roomRef = doc(db, "rooms", roomId);
      const snap = await getDoc(roomRef);
      if (!snap.exists()) {
        await setDoc(roomRef, { participants: [user.uid, peerId], createdAt: serverTimestamp() });
      }

      // Live Firestore Listener Pipeline
      onSnapshot(query(collection(db, "rooms", roomId, "messages"), orderBy("sentAt", "asc"), limit(150)), (snapshot) => {
        chatBox.innerHTML = "";
        
        if(snapshot.empty) { 
          chatBox.innerHTML = `
            <div style="text-align:center; padding: 40px; color: var(--text-muted);">
              <svg viewBox="0 0 24 24" style="width:40px;fill:currentColor;opacity:0.5;margin-bottom:10px;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
              <p>Secure link established.<br>Start your collaboration.</p>
            </div>`; 
          return; 
        }

        snapshot.forEach((d) => {
          const m = d.data();
          const isMine = m.senderId === user.uid;
          
          const node = document.createElement("div");
          node.className = `message ${isMine ? 'mine' : 'other'}`;
          node.innerHTML = `
            <div class="bubble">${m.text.replace(/\n/g, "<br>")}</div>
            <div class="time">${formatTime(m.sentAt)}</div>
          `;
          chatBox.appendChild(node);
        });
        
        // Ensure UI stays at latest message
        setTimeout(scrollToBottom, 100);
      });
    }

    // Transmission Function
    window.sendMessage = async function() {
      const text = msgInput.value.trim();
      if(!text || !currentUser) return;
      
      // UI Reset
      msgInput.value = "";
      msgInput.style.height = "44px";
      sendBtn.disabled = true;
      
      try {
        await addDoc(collection(db, "rooms", roomId, "messages"), {
          senderId: currentUser.uid, 
          senderName: myName, 
          text: text, 
          sentAt: Date.now()
        });
      } catch (error) {
        console.error("Transmission failed:", error);
        alert("Message drop detected. Re-syncing...");
      } finally {
        msgInput.focus();
      }
    };

    // Keyboard Shortcuts (Enter to send, Shift+Enter for new line)
    msgInput.addEventListener("keydown", (e) => { 
      if (e.key === "Enter" && !e.shiftKey) { 
        e.preventDefault(); 
        sendMessage(); 
      } 
    });
    sendBtn.addEventListener("click", sendMessage);

    // Auth & Boot Sequence
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;
      
      const profile = await getDoc(doc(db, "users", user.uid));
      if(profile.exists()) myName = profile.data().username;
      
      statusText.textContent = `Node Secured. Connected with ${peerName}`;
      initChatEngine(user);
    });

    // -------------------------------------------
    // ZEGOCLOUD AV REALTIME ENGINE (Future Call Tech)
    // -------------------------------------------
    window.startMediaEngine = function() {
      const targetPanel = document.getElementById("call-container");
      targetPanel.style.display = "block";
      vcTriggerBtn.style.display = "none";

      const appID = 117265584; 
      const serverSecret = "66127bfcb7ba00a12cfda0429fdf3cc2";
      
      // Cryptographic token generation for WebRTC Auth
      const token = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomId, currentUser.uid, myName);
      const zp = ZegoUIKitPrebuilt.create(token);

      zp.joinRoom({
        container: targetPanel,
        scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
        showPreJoinView: true,
        turnOnMicrophoneWhenJoining: false,
        turnOnCameraWhenJoining: false, 
        showMyCameraToggleButton: true, 
        showMyMicrophoneToggleButton: true,
        showAudioVideoSettingsButton: true,
        onLeaveRoom: () => { 
          targetPanel.style.display = "none"; 
          vcTriggerBtn.style.display = "block"; 
        }
      });
    };
  </script>
</body>
</html>
